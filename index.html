/* ===================== LEARNING: WORDS, NUDGES, BREAK-EVEN, GROWN-UP CHECK ===================== */
// Word of the step. One plain sentence each, 20 words or fewer. Edit freely.
const WORDS = {
  profit:    {word:'Profit', text:'The money you keep after paying for everything you used.'},
  margin:    {word:'Profit margin', text:'How much of each sale you keep as profit, shown as a percentage of the price.'},
  wholesale: {word:'Wholesale', text:'The lower price you pay when you buy lots of something to sell on.'},
  startup:   {word:'Startup costs', text:'Things you buy once, before you can open for business.'},
  breakeven: {word:'Break-even', text:'The point where you have earned back your startup costs. Everything after that is profit.'},
};
// Which words appear on which step. Wholesale only fits when you sell things.
const STEP_WORDS = {
  pricing: kind => kind === 'product' ? ['profit','margin','wholesale'] : ['profit','margin'],
  startup: () => ['startup'],
  goals:   () => ['breakeven'],
};
function wordsForStep(stepId, kind){ return STEP_WORDS[stepId] ? STEP_WORDS[stepId](kind) : []; }
function wordsLearned(kind){ return Object.keys(STEP_WORDS).flatMap(id=>wordsForStep(id, kind)); }

function wordCard(stepId){
  const ids = wordsForStep(stepId, profile.kind);
  if(!ids.length) return el(`<div hidden></div>`);
  return el(`
    <aside class="word-card" aria-label="Word of the step">
      <div class="word-card-title"><span aria-hidden="true">📖</span> ${ids.length > 1 ? 'Words' : 'Word'} of the step</div>
      <dl>${ids.map(id=>`<div class="word-row"><dt>${escHtml(WORDS[id].word)}:</dt> <dd>${escHtml(WORDS[id].text)}</dd></div>`).join('')}</dl>
    </aside>
  `);
}

// "Think about it" nudges: gentle, never block Next, and can be hidden.
// Rules only look at percentages and counts, so they work in any currency.
const NUDGE_LIMITS = { highMarginPct: 90, bigWeeklyGoal: 50 };
const NUDGE_RULES = [
  {id:'free-product', step:'pricing', focus:'#f-cost',
   when: n => n.kind === 'product' && n.price > 0 && n.cost === 0,
   text: () => 'Is anything really free? Even things you make yourself use up materials. What do they cost?'},
  {id:'free-service', step:'pricing', focus:'#f-cost',
   when: n => n.kind === 'service' && n.price > 0 && n.cost === 0,
   text: () => 'Is your time free? Having no supplies to buy is great, but think about how long each job takes you.'},
  {id:'high-margin', step:'pricing', focus:'#f-price',
   when: n => n.cost > 0 && n.price > n.cost && n.margin >= NUDGE_LIMITS.highMarginPct,
   text: () => 'That is a very high profit margin. Would customers really pay that much more than it costs you?'},
  {id:'big-goal', step:'goals', focus:'#f-goal',
   when: n => n.goal > NUDGE_LIMITS.bigWeeklyGoal,
   text: n => `Could you really ${n.kind === 'service' ? 'do' : 'sell'} that many ${n.unitPlural} in one week, with school and homework too?`},
];
function nudgeFacts(s, prof){
  const cost = num(s.unitCost), price = num(s.sellPrice);
  return {kind: prof.kind, cost, price, margin: price > 0 ? Math.round((price - cost) / price * 100) : 0,
          goal: num(s.weeklySalesGoal), unitPlural: prof.unitPlural};
}
function nudgesFor(stepId, s, prof){
  const n = nudgeFacts(s, prof);
  return NUDGE_RULES.filter(r=>r.step === stepId && r.when(n)).map(r=>({id:r.id, text:r.text(n), focus:r.focus}));
}
const dismissedNudges = new Set(); // for this visit only; never saved

function nudgeBox(stepId, card){
  const box = el(`<div class="nudges" role="status" aria-live="polite"></div>`);
  let shownKey = null;
  box.update = function update(){
    const list = nudgesFor(stepId, state, profile).filter(x=>!dismissedNudges.has(x.id));
    // Only touch the live region when the set of tips changes, so a screen
    // reader doesn't repeat the same tip on every keystroke.
    const key = list.map(x=>x.id).join('|');
    if(key === shownKey) return;
    shownKey = key;
    box.innerHTML = '';
    list.forEach(x=>{
      const item = el(`
        <div class="nudge" data-nudge="${escAttr(x.id)}">
          <span aria-hidden="true">🤔</span>
          <span class="nudge-text"><strong>Think about it:</strong> ${escHtml(x.text)}</span>
          <button type="button" class="nudge-dismiss" aria-label="Got it, hide this tip">Got it</button>
        </div>
      `);
      item.querySelector('button').onclick = (e)=>{
        dismissedNudges.add(x.id);
        box.update();
        if(e.detail === 0){ const f = card.querySelector(x.focus); if(f) f.focus(); }
      };
      box.appendChild(item);
    });
  };
  return box;
}

// Rounds up without float noise: 0.0001 / 0.00002 is 5.000000000000001 in
// JavaScript, which must still be 5, not 6.
function ceilClean(q){ return Math.ceil(q * (1 - 1e-12)); }

// How many sales (or jobs) pay back the startup costs. 0 when there is
// nothing to pay back; null when each sale makes no profit.
function breakEvenUnits(totalStartup, profitEach){
  if(!(totalStartup > 0)) return 0;
  if(!(profitEach > 0)) return null;
  return ceilClean(totalStartup / profitEach);
}
function breakEvenShort(units, prof){
  if(units === null) return 'Not yet';
  return `${KIND_WORDS[prof.kind].doVerb} ${units} ${units === 1 ? prof.unit : prof.unitPlural}`;
}
function breakEvenSentence(units, prof){
  if(units === null) return `Once each ${prof.unit} makes a profit, you can start paying back your startup costs.`;
  if(units === 0) return 'You have no startup costs to pay back, so you make a profit from the start.';
  return `${breakEvenShort(units, prof)} to pay back your startup costs.`;
}

// Grown-up check: fixed, kind wording, chosen by the idea and the kind.
function grownUpChecklist(s, prof){
  const service = prof.kind === 'service';
  const items = [
    'We read this plan together, and it sounds safe and fair.',
    'We will sell face to face, with a grown-up nearby, and only in places a grown-up has said yes to.',
    'If we ever want to sell online, a grown-up will set it up and look after it for us.',
    'We checked any local rules together, like whether we need permission to set up a stall.',
    s.startupMoneySource === 'Parents lend it'
      ? 'We agreed how and when the money we borrowed will be paid back.'
      : 'We agreed where the starting money comes from.',
  ];
  if(prof.food) items.push('Food and drink: we will wash our hands, keep everything clean, and list the ingredients, including allergens like nuts, milk, eggs and wheat.');
  if(service) items.push('Safety: a grown-up will always know where we are and who we are with, and we will not go into a customer\'s home on our own.');
  (prof.safetyNotes || []).forEach(n=>items.push(n));
  return items;
}

function capitalise(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function generateStartupSteps(){

    });

  return steps;

// The plan's numbers, shared by the plan page and the .md export so the
// two can never disagree.
function planNumbers(){
  const cost = num(state.unitCost), price = num(state.sellPrice);
  const profit = price - cost;
  const margin = price>0 ? Math.round((profit/price)*100) : 0;
  const totalStartup = state.startupCosts.reduce((s,r)=>s+num(r.amount),0);
  const weeklyGoal = num(state.weeklySalesGoal);
  const weeklyProfit = weeklyGoal*profit;
  const monthlyProfit = weeklyProfit*4;
  // The tiny epsilon stops float noise (0.0001/0.00002 = 5.000000000000001)
  // from rounding a whole number of weeks up by one.
  const weeksToBreakEven = profit>0 && weeklyGoal>0 ? breakEvenUnits(totalStartup, weeklyProfit) : null;
  const unitsToBreakEven = breakEvenUnits(totalStartup, profit);
  const perFounderRows = state.founders.map(f=>{
    const share = num(f.sharePct)/100;
    return {name:f.name, weekly: weeklyProfit*share, monthly: monthlyProfit*share, pct: Math.round(num(f.sharePct))};
  });
  return {cost, price, profit, margin, totalStartup, weeklyGoal, weeklyProfit, monthlyProfit, weeksToBreakEven, unitsToBreakEven, perFounderRows};
}

// A money table only scrolls sideways on a narrow phone with very big
// numbers. Only then does its wrapper become a named, focusable region, so
// keyboard users can reach it and scroll it with the arrow keys; the rest of
// the time it adds no extra tab stop.
let tableScrollObserver = null;
function updateTableScroller(box){
  if(box.scrollWidth > box.clientWidth + 1){
    box.setAttribute('tabindex', '0');
    box.setAttribute('role', 'region');
    box.setAttribute('aria-label', 'Money table, scrolls sideways');
  } else {
    box.removeAttribute('tabindex');
    box.removeAttribute('role');
    box.removeAttribute('aria-label');
  }
}
function watchTableScrollers(){
  if(tableScrollObserver) tableScrollObserver.disconnect();
  const boxes = document.querySelectorAll('#plan-shell .table-scroll');
  boxes.forEach(updateTableScroller);
  if(window.ResizeObserver){
    tableScrollObserver = new ResizeObserver(entries => entries.forEach(e => updateTableScroller(e.target)));
    boxes.forEach(b => tableScrollObserver.observe(b));
  }
}

/* ---- Charts (guarded: the plan must still work if Chart.js is missing) ---- */
function chartsAvailable(){ return typeof window.Chart === 'function'; }

function showChartFallback(canvasId){
  const canvas = document.getElementById(canvasId);
  const box = canvas && canvas.closest('.chart-canvas-box');
  if(!box) return;
  box.style.height = 'auto';
  box.innerHTML = '<p class="chart-fallback">Sorry, this chart could not load. All your numbers are still in the plan.</p>';
}

function drawCharts(costs, weeklyGoal, weeklyProfit, monthlyProfit, perFounderRows){
  destroyCharts();
  const validCosts = costs.filter(r=>r.label.trim() && num(r.amount)>0);
  const weeks = [weeklyProfit, weeklyProfit*2, weeklyProfit*3, monthlyProfit];

  // Screen readers get the numbers even when the picture can't be seen.
  const c1 = document.getElementById('costs-chart');
  const c2 = document.getElementById('profit-chart');
  if(c1) c1.setAttribute('aria-label', 'Where the starting money goes: ' + validCosts.map(r=>`${r.label} ${money(num(r.amount))}`).join(', '));
  if(c2) c2.setAttribute('aria-label', 'Profit adding up: ' + weeks.map((v,i)=>`after week ${i+1}, ${money(v)}`).join('; '));

  if(!chartsAvailable()){
    showChartFallback('costs-chart');
    showChartFallback('profit-chart');
    return;
  }

  if(c1 && validCosts.length){
    try{
      costsChart = new Chart(c1, {

      });
    }catch(e){ showChartFallback('costs-chart'); }

        },
        options:{
          responsive:true, maintainAspectRatio:false, animation: prefersReducedMotion() ? false : undefined, plugins:{ legend:{display:false} },

/* ===================== NAV / RENDER LOOP ===================== */
function initNav(){
  window.container = document.getElementById('step-container');
  window.topbar = document.getElementById('topbar');
  window.progressTrack = document.getElementById('progress-track');
  window.progressFill = document.getElementById('progress-fill');
  window.progressLabel = document.getElementById('progress-label');
}

function contentStepIndices(){
  return steps.map((s,i)=> (!s.isWelcome && !s.isFinish) ? i : -1).filter(i=>i>-1);
}

function renderStep(opts){
  container.innerHTML = '';
  const step = steps[currentStep];
  const isContent = !step.isWelcome && !step.isFinish;
  topbar.style.display = isContent ? 'flex' : 'none';

  if(isContent){
    const contentIdx = contentStepIndices();
    const pos = contentIdx.indexOf(currentStep);
    const pct = Math.round(((pos)/(contentIdx.length-1))*100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = `${pos+1} / ${contentIdx.length}`;
    progressTrack.setAttribute('aria-valuemax', String(contentIdx.length));
    progressTrack.setAttribute('aria-valuenow', String(pos+1));
    progressTrack.setAttribute('aria-valuetext', `Step ${pos+1} of ${contentIdx.length}`);
  }

  step.render(container);

  if(isContent){
    // Always in the page (not display:none) so screen readers announce it.
    const errorHolder = el(`<div class="error-msg" role="alert"></div>`);
    const nav = el(`
      <div class="nav-row">
        <button class="btn btn-ghost" id="back-btn" type="button">Back</button>
        <button class="btn btn-primary" id="next-btn" type="button">Next</button>
      </div>
    `);
    const cardEl = container.querySelector('.card');
    cardEl.appendChild(errorHolder);
    cardEl.appendChild(nav);
    nav.querySelector('#back-btn').onclick = ()=> goToStep(currentStep-1);
    nav.querySelector('#next-btn').onclick = ()=>{
      const result = step.validate ? step.validate() : true;
      if(result !== true){
        errorHolder.textContent = result;
        return;
      }
      errorHolder.textContent = '';
      if(step.onLeave) step.onLeave();
      goToStep(currentStep+1);
    };
    if(currentStep === contentStepIndices()[0]) nav.querySelector('#back-btn').style.visibility = 'hidden';

    container.querySelectorAll('input[type="text"], input[type="number"]').forEach(inp=>{
      // Freeform "add" boxes and suggestion-tile text edits handle Enter
      // themselves (add the item), so don't also advance the whole step.
      if(inp.closest('.freeform-row') || inp.closest('.suggest-tile')) return;
      inp.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          nav.querySelector('#next-btn').click();
        }
      });
    });
  }
  if(opts && opts.focus){
    const heading = container.querySelector('h1');
    if(heading) heading.focus({preventScroll:true});
  }
  if(hasNavigatedOnce) saveState();
}

function goToStep(i){
  hasNavigatedOnce = true;
  currentStep = Math.max(0, Math.min(steps.length-1, i));
  window.scrollTo({top:0, behavior: prefersReducedMotion() ? 'auto' : 'smooth'});
  renderStep({focus:true});
}

function backToWizard(){
  document.getElementById('plan-view').style.display = 'none';
  document.getElementById('wizard-view').style.display = '';
  goToStep(1);
}

function slugify(s){
  return String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40).replace(/-+$/,'');
}
function todayStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function backupFilename(ext){
  return `${slugify(state.businessName) || 'squish-hq-plan'}-${todayStamp()}.${ext}`;
}

// Returns a short message describing what happened, for the status line.
function downloadFile(filename, text, mime){
  const blob = new Blob([text], {type: mime});
  const url = URL.createObjectURL(blob);
  if('download' in HTMLAnchorElement.prototype){
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoking straight away can cancel the download in some browsers.
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    return `✓ Saved ${filename}. Look in your Downloads folder (or Files on an iPhone or iPad).`;
  }
  // Very old iOS Safari ignores a[download]. Open the file in a new tab
  // instead of navigating this page away, so the plan stays on screen.
  window.open(url, '_blank');
  return `Your file opened in a new tab. Use Share, then "Save to Files", to keep it.`;
}

/* ===================== IMPORT ===================== */
const IMPORT_MAX_BYTES = 200 * 1024;

// Returns {ok:true, state, currentStep, finished} or {ok:false, message}.
function parseBackup(text){
  const bad = msg => ({ok:false, message: msg});
  const notOurs = "That file doesn't look like a Squish HQ plan backup. Try the .json file you downloaded from the \"Start again\" box.";
  let data;
  try{ data = JSON.parse(text); }catch(e){ return bad(notOurs); }
  if(!data || typeof data !== 'object' || Array.isArray(data) || data.app !== APP_MARKER || !Number.isInteger(data.schemaVersion)){
    return bad(notOurs);
  }
  if(data.schemaVersion > SCHEMA_VERSION){
    return bad("This plan was saved by a newer version of Squish HQ. Ask a grown-up to refresh the page and try again.");
  }
  data = migratePayload(data);
  const problems = [];
  const clean = sanitizeState(data.state, problems);
  if(problems.length || !('founders' in data.state)){
    return bad("Some of this plan backup is broken or has been changed, so we can't load it safely. Try another copy.");
  }
  return {ok:true, state: clean, currentStep: clampStep(data.currentStep), finished: data.finished === true};
}

function readFileText(file){
  if(file.text) return file.text();
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsText(file);
  });
}

async function importPlanFile(file, msgEl){
  msgEl.className = 'load-msg';
  msgEl.textContent = '';
  const fail = m => { msgEl.className = 'load-msg bad'; msgEl.textContent = m; };
  if(file.size > IMPORT_MAX_BYTES) return fail("That file is too big to be a Squish HQ plan backup.");
  let text;
  try{ text = await readFileText(file); }catch(e){ return fail("We couldn't open that file. Try picking it again."); }
  const result = parseBackup(text);
  if(!result.ok) return fail(result.message);

  state = result.state;
  refreshProfile();
  // Never trust the file's idea of how far along it is: land on the first
  // step that isn't complete, and only show the finished plan if every step
  // passes its own check.
  const firstIncomplete = contentStepIndices().find(i=>{ const s = steps[i]; return s.validate && s.validate() !== true; });
  if(firstIncomplete === undefined){
    finished = result.finished;
    currentStep = result.currentStep || 1;
  } else {
    finished = false;
    currentStep = Math.max(1, Math.min(result.currentStep || 1, firstIncomplete));
  }
  hasNavigatedOnce = true;
  saveState();
  if(finished){
    showPlan({focus:true});
    window.scrollTo({top:0});
  } else {
    goToStep(currentStep);
  }
}

function destroyCharts(){

// Wipes everything. Order matters: in-memory flags are reset in the same
// synchronous run as the storage wipe, so the pagehide / beforeunload /
// visibilitychange savers (which bail while hasNavigatedOnce is false, and
// would only ever write the clean default anyway) can't bring the old
// plan back.
function resetApp(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = freshState();
  currentStep = 0;
  finished = false;
  hasNavigatedOnce = false;
  dismissedNudges.clear();
  refreshProfile();
  destroyCharts();
  const confetti = document.getElementById('confetti-canvas');
  confetti.getContext('2d').clearRect(0,0,confetti.width,confetti.height);
  document.getElementById('plan-shell').innerHTML = '';
  document.getElementById('plan-view').style.display = 'none';
  document.getElementById('wizard-view').style.display = '';
  renderStep();
  window.scrollTo({top:0});
}

/* ===================== START AGAIN MODAL ===================== */
const resetModal = (function(){
  const overlay = document.getElementById('reset-overlay');
  const dialog = document.getElementById('reset-modal');
  const status = document.getElementById('backup-status');
  const cancelBtn = document.getElementById('reset-cancel-btn');
  const bgRegions = ['wizard-view','plan-view'].map(id=>document.getElementById(id));
  let returnFocus = null;
  let downOnBackdrop = false;

  function focusables(){
    return [...dialog.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(x=>!x.disabled && x.offsetParent !== null);
  }
  function onKeydown(e){
    if(e.key === 'Escape'){ e.preventDefault(); close(); return; }
    if(e.key !== 'Tab') return;
    const f = focusables();
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && (document.activeElement === first || !dialog.contains(document.activeElement))){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && (document.activeElement === last || !dialog.contains(document.activeElement))){ e.preventDefault(); first.focus(); }
  }
  function onFocusIn(e){ if(!dialog.contains(e.target)) cancelBtn.focus(); }

  function open(){
    // Safari doesn't focus a button when it's tapped, so fall back to the trigger.
    returnFocus = document.activeElement && document.activeElement !== document.body
      ? document.activeElement : document.getElementById('start-again-btn');
    document.getElementById('reset-plan-name').textContent = state.businessName.trim() ? ` for ${state.businessName.trim()}` : '';
    status.textContent = '';
    overlay.hidden = false;
    bgRegions.forEach(r=>{ r.inert = true; r.setAttribute('aria-hidden','true'); });
    document.body.style.overflow = 'hidden';
    document.addEventListener('keydown', onKeydown, true);
    document.addEventListener('focusin', onFocusIn);
    cancelBtn.focus();
  }
  function close(opts){
    if(overlay.hidden) return;
    overlay.hidden = true;
    bgRegions.forEach(r=>{ r.inert = false; r.removeAttribute('aria-hidden'); });
    document.body.style.overflow = '';
    document.removeEventListener('keydown', onKeydown, true);
    document.removeEventListener('focusin', onFocusIn);
    if(!(opts && opts.skipFocusReturn) && returnFocus && document.contains(returnFocus)) returnFocus.focus();
    returnFocus = null;
  }

  // Only a press that both starts and ends on the backdrop closes it, so a
  // drag or scroll that begins inside the box never cancels by accident.
  overlay.addEventListener('pointerdown', e=>{ downOnBackdrop = e.target === overlay; });
  overlay.addEventListener('click', e=>{
    if(e.target === overlay && downOnBackdrop) close();
    downOnBackdrop = false;
  });
  cancelBtn.onclick = ()=>close();
  document.getElementById('backup-json-btn').onclick = ()=>{ status.textContent = exportBackupJSON(); };
  document.getElementById('backup-md-btn').onclick = ()=>{ status.textContent = exportPlanMarkdown(); };
  document.getElementById('backup-print-btn').onclick = ()=>{
    window.print();
    status.textContent = 'If you saved a PDF from the print window, your copy is safe.';
  };
  document.getElementById('reset-confirm-btn').onclick = ()=>{
    close({skipFocusReturn:true});
    resetApp();
    const startBtn = document.getElementById('start-btn');
    if(startBtn) startBtn.focus({preventScroll:true});
  };
  return {open, close};
})();
function openResetModal(){ resetModal.open(); }

/* ===================== INIT ===================== */
(function init(){
  readSavedState();
  initNav();
  // Savers go on first, so nothing that goes wrong while drawing the page
  // (for example Chart.js failing to load) can stop the plan being saved.
  window.addEventListener('pagehide', saveState);
  window.addEventListener('beforeunload', saveState);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden') saveState();
  });
  // If the plan is wiped in another tab, this tab must not quietly write
  // its stale copy back when it's closed or hidden.
  window.addEventListener('storage', e=>{
    // key is null when the other tab called localStorage.clear().
    if((e.key === STORAGE_KEY || e.key === null) && e.newValue === null && e.storageArea === localStorage){
      resetModal.close({skipFocusReturn:true});
      resetApp();
    }
  });
  if(finished){
    showPlan();
  } else {
    renderStep();
  }
})();


</script>
